<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #dfe9f3, #ffffff);
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 30px;
        }

        /* FORM CARD */
        .form-box {
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .form-box label {
            font-weight: bold;
            color: #555;
        }

        .form-box input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .form-box input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52,152,219,0.5);
        }

        .form-box input[type="submit"] {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #3498db;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .form-box input[type="submit"]:hover {
            background: #2980b9;
        }

        /* TABLE */
        .table-container {
            width: 70%;
            margin: 30px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background: #3498db;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #eaf4fb;
        }

        /* ACTION LINKS */
        .action a {
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            margin: 2px;
        }

        .edit {
            background: #2ecc71;
            color: white;
        }

        .delete {
            background: #e74c3c;
            color: white;
        }

        .edit:hover {
            background: #27ae60;
        }

        .delete:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

    <h1>Category</h1>

    <!-- FORM -->
    <div class="form-box">
        <form method="POST">
            {% csrf_token %}
            
            <label>Category Name</label>
            <input type="text" name="txtname" value="{{data.category_name}}" required>

            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- TABLE -->
    <h1>Category List</h1>

    <div class="table-container">
        <table>
            <tr>
                <th>No</th>
                <th>Category</th>
                <th>Action</th>
            </tr>

            {% for i in categ %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ i.category_name }}</td>
                <td class="action">
                    <a href="{% url 'Admin:CategoryEdit' i.id %}" class="edit">Edit</a>
                    <a href="{% url 'Admin:CategoryDelete' i.id %}" class="delete">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
