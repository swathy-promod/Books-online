<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Registration</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #105858, #3e867e);
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        color: white;
        margin-top: 30px;
    }

    /* Form Container */
    .form-box {
        width: 400px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    table {
        width: 100%;
    }

    td {
        padding: 10px;
    }

    td:first-child {
        font-weight: bold;
        color: #555;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102,126,234,0.5);
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #1f777f;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background: #093233;
    }

    /* Table Styling */
    .list-table {
        width: 80%;
        margin: 30px auto;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .list-table th {
        background: #0e3a30;
        color: white;
        padding: 12px;
    }

    .list-table td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    .list-table tr:nth-child(even) {
        background: #f2f2f2;
    }

    .list-table tr:hover {
        background: #e6ecff;
    }

    /* Buttons */
    .btn {
        padding: 6px 12px;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        font-size: 13px;
    }

    .edit {
        background: #28a745;
    }

    .edit:hover {
        background: #218838;
    }

    .delete {
        background: #dc3545;
    }

    .delete:hover {
        background: #c82333;
    }
</style>
</head>

<body>

<h1>Admin Registration</h1>

<div class="form-box">
    <form method="post">
        {% csrf_token %}
        <table>
            <tr>
                <td>Name</td>
                <td><input type="text" name="txtname" value="{{ edit.admin_name|default:'' }}"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" name="txtEmail" value="{{ edit.admin_email|default:'' }}"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="txtpass" value="{{ edit.admin_password|default:'' }}"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
    </form>
</div>

<h1>Admin List</h1>

<table class="list-table">
    <tr>
        <th>SL NO</th>
        <th>Name</th>
        <th>Email</th>
        <th>Password</th>
        <th>Action</th>
    </tr>

    {% for i in admins %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ i.admin_name }}</td>
        <td>{{ i.admin_email }}</td>
        <td>{{ i.admin_password }}</td>
        <td>
            <a href="{% url 'Admin:AdminEdit' i.id %}" class="btn edit">Edit</a>
            <a href="{% url 'Admin:AdminDelete' i.id %}" class="btn delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
