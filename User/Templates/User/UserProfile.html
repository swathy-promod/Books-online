<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Profile</title>

        <style>
                body {
                        font-family: Arial, Helvetica, sans-serif;
                        background: linear-gradient(135deg, #0e4c31, #043d32);
                        margin: 0;
                        padding: 0;
                        height: 100vh;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                }

                .profile-card {
                        background: white;
                        width: 420px;
                        padding: 30px;
                        border-radius: 12px;
                        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
                        text-align: center;
                }

                .profile-card h1 {
                        margin-bottom: 20px;
                }

                .profile-img {
                        width: 120px;
                        height: 120px;
                        border-radius: 50%;
                        object-fit: cover;
                        border: 4px solid #020405;
                        margin-bottom: 20px;
                }

                table {
                        width: 100%;
                        border-collapse: collapse;
                        margin-top: 10px;
                }

                td {
                        padding: 10px;
                        text-align: left;
                }

                td:first-child {
                        font-weight: bold;
                        width: 40%;
                }

                tr:nth-child(even) {
                        background: #f2f2f2;
                }

                .buttons {
                        margin-top: 20px;
                }

                .buttons a {
                        text-decoration: none;
                        padding: 10px 18px;
                        border-radius: 6px;
                        margin: 5px;
                        color: white;
                        font-weight: bold;
                }

                .edit {
                        background: #28a745;
                }

                .password {
                        background: #0b4140;
                }

                .buttons a:hover {
                        opacity: 0.8;
                }
        </style>
</head>

<body>

        <div class="profile-card">

                <h1>User Profile</h1>

                <img src="{{data.user_photo.url}}" class="profile-img">

                <table>
                        <tr>
                                <td>Name</td>
                                <td>{{data.user_name}}</td>
                        </tr>

                        <tr>
                                <td>Email</td>
                                <td>{{data.user_email}}</td>
                        </tr>

                        <tr>
                                <td>Contact</td>
                                <td>{{data.user_contact}}</td>
                        </tr>

                        <tr>
                                <td>Biography</td>
                                <td>{{data.user_bio}}</td>
                        </tr>

                        <tr>
                                <td>District</td>
                                <td>{{data.place.district_id.district_name}}</td>
                        </tr>

                        <tr>
                                <td>Place</td>
                                <td>{{data.place.place_name}}</td>
                        </tr>
                </table>

                <div class="buttons">
                        <a href="{% url 'User:UserEditProfile' %}" class="edit">Edit Profile</a>
                        <a href="{% url 'User:UserChangePassword' %}" class="password">Change Password</a>
                </div>

        </div>

</body>

</html>
