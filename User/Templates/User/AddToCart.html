<!DOCTYPE html>
<html>

<head>
    <title>Cart</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2
        }

        .container {
            width: 80%;
            margin: auto;
            background: #fff;
            padding: 20px
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center
        }

        th {
            background: #007bff;
            color: #fff
        }

        .btn {
            padding: 10px 15px;
            background: green;
            color: #fff;
            text-decoration: none
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🛒 Cart</h2>

        <table>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
            </tr>

            {% for i in cart %}
            <tr>
                <td>{{i.product.product_name}}</td>
                <td>{{i.product.product_price}}</td>
                <td>{{i.cart_qnty}}</td>
                <td>{{i.product.product_price}}</td>
            </tr>
            {% endfor %}

        </table>

        <h3>Total: ₹{{total}}</h3>

        <a href="{% url 'User:Booking' %}" class="btn">Checkout</a>
    </div>

</body>

</html>
