<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0a3c37, #104f44);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 10px 5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="password"]:focus {
            border-color: #0a3e37;
            outline: none;
        }

        .btn-group {
            text-align: center;
            padding-top: 10px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }

        .btn-change {
            background: #1e5c50;
        }

        .btn-change:hover {
            background: #14423a;
        }

        .btn-cancel {
            background: #b33939;
            text-decoration: none;
            display: inline-block;
        }

        .btn-cancel:hover {
            background: #8e2d2d;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Change Password</h2>

        <form method="post">
            {% csrf_token %}

            <table>

                <tr>
                    <td>Old Password</td>
                    <td><input type="password" name="txt_old" required></td>
                </tr>

                <tr>
                    <td>New Password</td>
                    <td><input type="password" name="txt_new" required></td>
                </tr>

                <tr>
                    <td>Retype Password</td>
                    <td><input type="password" name="txt_re" required></td>
                </tr>

            </table>

            <div class="btn-group">
                <input type="submit" value="Change Password" class="btn btn-change">

                <a href="{% url 'User:Homepage' %}" class="btn btn-cancel">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</body>

</html>
