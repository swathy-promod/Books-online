<!DOCTYPE html>
<html>

<head>
    <title>Booking</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        .container {
            width: 700px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        .status-pending {
            color: orange;
            font-weight: bold;
        }

        .status-done {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📦 Booking</h2>
        <div class="booking-container">
            <form method="post">
                {% csrf_token %}
                <table>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>

                    {% for i in cart %}
                    <tr>
                        <td>{{ i.product.product_name }}</td>
                        <td>₹{{ i.product.product_price }}</td>
                        <td>{{ i.cart_qnty }}</td>
                        <td>₹{{ i.subtotal }}</td>
                        <td>
                            <a href="{% url 'User:DeleteBooking' i.id %}" class="btn delete">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}

                    <tr>
                        <td colspan="3"><b>Grand Total</b></td>
                        <td><b>₹{{ total }}</b></td>
                    </tr>
                </table>

                <br>

                <input type="submit" value="Confirm Booking">
            </form>
        </div>

    </div>

</body>

</html>
