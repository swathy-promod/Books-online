<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Registration</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #091d1d, #012123);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 95%;              /* responsive width */
        max-width: 380px;        /* limit max size */
        max-height: 95vh;        /* fit screen height */
        overflow-y: auto;        /* scroll inside */
        background: #fff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h2 {
        text-align: center;
        font-size: 18px;
        margin-bottom: 10px;
    }

    .form-group {
        margin-bottom: 6px;
    }

    label {
        font-size: 12px;
        margin-bottom: 2px;
        display: block;
    }

    input, select {
        width: 100%;
        padding: 6px;
        font-size: 12px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    input:focus, select:focus {
        border-color: #012c2b;
        outline: none;
    }

    .row {
        display: flex;
        gap: 5px;
    }

    .row .form-group {
        flex: 1;
    }

    button {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        font-size: 13px;
        background: linear-gradient(135deg, #051f24, #022628);
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    .footer-text {
        text-align: center;
        font-size: 11px;
        margin-top: 6px;
    }

    /* Mobile Fix */
    @media(max-height: 600px) {
        body {
            align-items: flex-start;
            padding-top: 10px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h2>Seller Registration</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="txt_name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="txt_email" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Contact</label>
                <input type="text" name="txt_contact" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="txt_password" required>
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" name="txt_address" required>
        </div>

        <div class="form-group">
            <label>Photo</label>
            <input type="file" name="txt_photo" required>
        </div>

        <div class="form-group">
            <label>Proof</label>
            <input type="file" name="txt_proof" required>
        </div>

        <div class="form-group">
                <label>District</label>
                <select name="dis">
                    <option>--Select--</option>
                    {% for i in disData %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Place</label>
                <select name="pla">
                    <option>--Select--</option>
                    {% for i in pla %}
                    <option value="{{i.id}}">{{i.place_name}}</option>
                    {% endfor %}
                </select>
            </div>

        <div class="row">
            <div class="form-group">
                <label>Date of Joining</label>
                <input type="date" name="txt_doj" required>
            </div>

            <div class="form-group">
                <label>Year of Establishment</label>
                <input type="year" name="txt_doe" required>
            </div>
        </div>

        <div class="form-group">
            <label>Licence Number</label>
            <input type="text" name="txt_licence" required>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="{% url 'Guest:Login'%}">Login</a>
    </div>
</div>

</body>
</html>
