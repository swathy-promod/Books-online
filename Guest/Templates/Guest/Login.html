{% block content %}

<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #16372f, #072725);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* Login Card */
        .login-box {
            background: #f5f5f5;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Inputs */
        .input-box {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        .input-box:focus {
            border-color: #0d332d;
            box-shadow: 0 0 5px rgba(13, 51, 45, 0.3);
        }

        /* Button */
        .input-box,
        .login-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* Input specific */
        .input-box {
            border: 1px solid #ccc;
        }

        /* Button specific */
        .login-btn {
            border: 1px solid #ccc;
            /* add same border */
            background: #0d332d;
            color: white;
            cursor: pointer;
        }

        /* Hover effect */
        .login-btn:hover {
            background: #145c45;
        }

        /* Click effect */
        .login-btn:active {
            transform: scale(0.97);
        }
    </style>

</head>

<body>

    <div class="login-box">

        {% if msg %}
        <script>
            alert("{{msg}}")
        </script>
        {% endif %}

        <h2>Login</h2>

        <form method="post">
            {% csrf_token %}

            <input type="email" name="txtemail" placeholder="Enter Email" class="input-box" required>

            <input type="password" name="txtpass" placeholder="Enter Password" class="input-box" required>

            <button type="submit" class="login-btn">Login</button>


        </form>

    </div>

</body>

</html>
{% endblock content %}
