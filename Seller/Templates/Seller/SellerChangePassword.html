<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Seller Change Password</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0a3837, #123531);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 300px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        .buttons input,
        .buttons a {
            text-decoration: none;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 13px;
            cursor: pointer;
        }

        .change-btn {
            background: #28a745;
        }

        .change-btn:hover {
            background: #218838;
        }

        .cancel-btn {
            background: #dc3545;
        }

        .cancel-btn:hover {
            background: #b02a37;
        }
    </style>

</head>

<body>

    <div class="card">

        <h2>Change Password</h2>

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Old Password</label>
                <input type="password" name="txt_old" required>
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="txt_new" required>
            </div>

            <div class="input-group">
                <label>Retype Password</label>
                <input type="password" name="txt_re" required>
            </div>

            <div class="buttons">
                <input type="submit" value="Change Password" class="change-btn">
                <a href="{% url 'Seller:Homepage' %}" class="cancel-btn">Cancel</a>
            </div>

        </form>

    </div>

</body>

</html>
