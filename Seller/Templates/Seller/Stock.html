<!DOCTYPE html>
<html>
<head>
    <title>Stock</title>
    <style>
        body {
            font-family: Arial;
            background: #eef3f8;
            padding: 30px;
        }

        .card {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #6f42c1;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: #6f42c1;
            color: white;
        }

        td, th {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Stock</h2>

    <form method="post">
        {% csrf_token %}

        <input type="number" name="txt_qty" placeholder="Quantity">

        <select name="sel_product">
            {% for p in products %}
            <option value="{{p.id}}">{{p.product_name}}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Stock</button>
    </form>

    <table>
        <tr>
            <th>#</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        {% for s in data %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{s.product_id.product_name}}</td>
            <td>{{s.stock_qnty}}</td>
            <td>{{s.stock_date}}</td>
            <td>
                <a href="{% url 'Seller:DeleteStock' s.id %}" style="color:red;">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
