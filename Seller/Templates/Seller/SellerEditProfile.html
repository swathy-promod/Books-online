<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Seller Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f4c5c, #1b262c);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-img {
            display: block;
            margin: 0 auto 15px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0f4c5c;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background: #dc3545;
            padding: 8px;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #b02a37;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Edit Profile</h2>

    <!-- Profile Image -->
    {% if seller.seller_photo %}
        <img src="{{seller.seller_photo.url}}" class="profile-img">
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Name</label>
        <input type="text" name="name" value="{{seller.seller_name}}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{seller.seller_email}}" required>

        <label>Contact</label>
        <input type="number" name="contact" value="{{seller.seller_contact}}" required>

        <label>Address</label>
        <textarea name="address" rows="3">{{seller.seller_address}}</textarea>

        <label>Update Photo</label>
        <input type="file" name="photo">

        <label>District</label>
        <select name="district" id="district">
            <option value="">-- Select District --</option>
            {% for d in district %}
            <option value="{{d.id}}" {% if d.id == seller.place.district.id %}selected{% endif %}>
                {{d.district_name}}
            </option>
            {% endfor %}
        </select>

        <label>Place</label>
        <select name="place" id="place">
            <option value="">-- Select Place --</option>
            {% for p in place %}
            <option value="{{p.id}}" {% if p.id == seller.place.id %}selected{% endif %}>
                {{p.place_name}}
            </option>
            {% endfor %}
        </select>

        <button type="submit">Update Profile</button>
    </form>

    <a href="{% url 'Seller:SellerProfile' %}" class="back-btn">Back</a>

</div>

</body>
</html>

<!-- AJAX for district -> place -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#district").change(function () {
        var did = $(this).val();
        var url = "{% url 'Guest:ajaxplace' %}";

        $.ajax({
            url: url,
            data: { did: did },
            success: function (data) {
                $("#place").html(data);
            }
        });
    });
</script>
