<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 900px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px;
            margin-top: 4px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #28a745;
            color: white;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background: #007bff;
            color: white;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }

        img {
            border-radius: 5px;
        }

    </style>
</head>
<body>

<div class="container">

    <h2>📦 Add Product</h2>

    <div class="form-section">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="txtname" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="txtdesc" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="text" name="txtprice" required>
            </div>

            <div class="form-group">
                <label>Type</label>
                <select name="type" required>
                    <option value="">--Select Type--</option>
                    {% for i in types %}
                    <option value="{{i.id}}">{{i.type_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Product Photo</label>
                <input type="file" name="txtphoto" required>
            </div>

            <button type="submit">Add Product</button>
        </form>
    </div>

    <h2>📋 Product List</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Type</th>
            <th>Photo</th>
            <th>Action</th>
        </tr>

        {% for i in productData %}
        <tr>
            <td>{{i.product_name}}</td>
            <td>{{i.product_description}}</td>
            <td>{{i.product_price}}</td>
            <td>{{i.type_id.type_name}}</td>
            <td>
                <img src="{{i.product_photo.url}}" width="60">
            </td>
            <td>
                <a href="{% url 'Seller:ProductDelete' i.id %}" style="color:red;">Delete</a>

            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
