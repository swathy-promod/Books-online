<!DOCTYPE html>
<html>
<head>
    <title>Reply Complaint</title>
</head>
<body>
<h2>Reply to Complaint</h2>

<form method="POST">
    {% csrf_token %}

    <p><b>Title:</b> {{complaint.complaint_title}}</p>
    <p><b>Details:</b> {{complaint.complaint_details}}</p>

    <textarea name="reply" placeholder="Enter your reply" required></textarea><br><br>

    <button type="submit">Send Reply</button>
</form>

</body>
</html>
