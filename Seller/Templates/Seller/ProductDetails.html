<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            padding: 30px;
        }

        .box {
            width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #ff9800;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th {
            background: #ff9800;
            color: white;
        }

        td, th {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Product Details</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="txt_author" placeholder="Author">
        <input type="text" name="txt_content" placeholder="Content">
        <input type="text" name="txt_written" placeholder="Written">
        <input type="text" name="txt_published" placeholder="Published">

        <select name="sel_product">
            {% for p in products %}
            <option value="{{p.id}}">{{p.product_name}}</option>
            {% endfor %}
        </select>

        <button type="submit">Add Details</button>
    </form>

    <table>
        <tr>
            <th>Sl No</th>
            <th>Author</th>
            <th>Product</th>
            <th>Action</th>
        </tr>

        {% for d in data %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{d.productdetails_author_name}}</td>
            <td>{{d.product_id.product_name}}</td>
            <td>
                <a href="{% url 'Seller:ProductDelete' d.id %}" style="color:red;">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
