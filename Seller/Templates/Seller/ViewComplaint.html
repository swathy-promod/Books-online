<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewComplaint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* TABLE STYLE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        /* HEADER */
        th {
            background: #007bff;
            color: white;
            padding: 10px;
            text-align: center;
        }

        /* CELLS */
        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        /* ROW HOVER */
        tr:hover {
            background: #f1f1f1;
        }

        /* ALTERNATE ROW COLOR */
        tr:nth-child(even) {
            background: #fafafa;
        }

        /* STATUS COLORS */
        td:nth-child(5) {
            font-weight: bold;
        }

        /* Pending = Red */
        td:nth-child(5):contains("Pending") {
            color: red;
        }

        /* Replied = Green */
        td:nth-child(5):contains("Replied") {
            color: green;
        }

        .reply-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }

        .reply-btn:hover {
            background: #218838;
        }
    </style>
</head>

<body>

    <h1>View Complaint</h1>

    <div class="container">
        <form method="post">
            {% csrf_token %}

            <table>
                <tr>
                    <th>User</th>
                    <th>Product</th>
                    <th>Title</th>
                    <th>Details</th>
                    <th>Status</th>
                    <th>Reply</th>
                </tr>

                {% for i in complaints %}
                <tr>
                    <td>{{i.user.user_name}}</td>
                    <td>{{i.product.product_name}}</td>
                    <td>{{i.complaint_title}}</td>
                    <td>{{i.complaint_details}}</td>

                    <td>
                        {% if i.complaint_status == 0 %}
                        Pending
                        {% else %}
                        Replied
                        {% endif %}
                    </td>

                    <td>
                        <a href="{% url 'Seller:Reply' i.id %}" class="reply-btn">Reply</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </form>
    </div>

</body>

</html>
